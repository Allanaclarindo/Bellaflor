<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bella Flor | Moda Feminina</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header>
  <h1>Bella Flor</h1>
  <p>Moda Feminina</p>
</header>
<section id="produtos">
  <h2>Catálogo</h2>
  <div class="busca">
  <input
    type="text"
    id="buscar"
    placeholder="🔍 Buscar produtos..."
    onkeyup="buscarProdutos()">
</div>
  <div class="produtos" id="lista-produtos"></div>
</section>
  <div class="filtros">

<button onclick="filtrarCategoria('Todos')">Todos</button>

<button onclick="filtrarCategoria('Vestidos')">Vestidos</button>

<button onclick="filtrarCategoria('Conjuntos')">Conjuntos</button>

<button onclick="filtrarCategoria('Tops')">Tops</button>

<button onclick="filtrarCategoria('Shorts')">Shorts</button>

<button onclick="filtrarCategoria('Blusas')">Blusas</button>

  </div>
<!-- MENU DE CATEGORIAS (deslizante) -->
<div id="menu-categorias" class="menu-categorias">
  <button class="menu-fechar" onclick="fecharMenuCategorias()">✕</button>
  <ul class="menu-lista">
    <li><button onclick="selecionarCategoriaMenu('Todos')">Todos</button></li>
    <li><button onclick="selecionarCategoriaMenu('Vestidos')">Vestidos</button></li>
    <li><button onclick="selecionarCategoriaMenu('Conjuntos')">Conjuntos</button></li>
    <li><button onclick="selecionarCategoriaMenu('Tops')">Tops</button></li>
    <li><button onclick="selecionarCategoriaMenu('Shorts')">Shorts</button></li>
    <li><button onclick="selecionarCategoriaMenu('Blusas')">Blusas</button></li>
  </ul>
</div>

<!-- MODAL DO PRODUTO -->
<div id="modal" class="modal">
  <div class="modal-conteudo">
    <h3 id="modal-nome"></h3>
    <!-- O JavaScript preenche esta área -->
    <div id="modal-imagens"></div>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>
<!-- MODAL TELA CHEIA -->
<div id="modal-imagem-full" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:9999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
">
  <img id="img-full" src="" style="max-width:100%; max-height:80%;">
  <div id="miniaturas" style="display:flex; gap:10px; margin-top:10px;"></div>
  <button onclick="fecharImagemFull()" style="
    position:absolute;
    top:20px;
    right:20px;
    background:white;
    border:none;
    padding:10px;
    border-radius:50%;
  ">✕</button>
</div>
<!-- CARRINHO -->
<div id="carrinho-lateral" class="carrinho">
  <h2>🛒 Carrinho</h2>
  <div id="itens-carrinho"></div>

  <!-- FRETE POR CEP -->
  <div class="frete-cep">
    <label for="cep">Calcular frete (CEP)</label>
    <input
      type="text"
      id="cep"
      placeholder="00000-000"
      maxlength="9"
      inputmode="numeric"
      oninput="formatarCep(this)">
    <button onclick="calcularFreteCep()">Calcular frete</button>
    <p id="frete-info"></p>
  </div>

  <p id="total"></p>
  <button onclick="enviarCarrinhoWhatsApp()">
    <i class="fa-brands fa-whatsapp" style="font-size:20px;"></i> Finalizar compra
  </button>
  <button onclick="fecharCarrinho()">
    Fechar
  </button>
</div>
<!-- BOTÃO FLUTUANTE WHATSAPP -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<a href="https://wa.me/5591985144347" target="_blank" id="whatsapp-flutuante">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<!-- MENU INFERIOR FIXO -->
<nav id="nav-inferior">
  <button class="nav-item" onclick="irParaTopo()">
    <span class="nav-icone"><i class="fa-solid fa-house"></i></span>
    <span class="nav-label">Início</span>
  </button>
  <button class="nav-item" onclick="abrirMenuCategorias()">
    <span class="nav-icone"><i class="fa-solid fa-bars"></i></span>
    <span class="nav-label">Categorias</span>
  </button>
  <button class="nav-item" onclick="irParaBusca()">
    <span class="nav-icone"><i class="fa-solid fa-magnifying-glass"></i></span>
    <span class="nav-label">Buscar</span>
  </button>
  <button class="nav-item" onclick="abrirWhatsappContato()">
    <span class="nav-icone"><i class="fa-brands fa-whatsapp"></i></span>
    <span class="nav-label">Contato</span>
  </button>
  <button class="nav-item" onclick="abrirCarrinho()">
    <span class="nav-icone">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="contador">0</span>
    </span>
    <span class="nav-label">Carrinho</span>
  </button>
</nav>

<script src="script.js"></script>
</body>
</html>
