<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bella Flor | Moda Feminina</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🌸 Bella Flor</h1>

<p>Moda Feminina</p>

</header>

<!-- BANNER -->

<section class="banner">

<img src="imagens/banner-flores.jpg" alt="Bella Flor">

<div class="banner-texto">

<h2>Nova Coleção</h2>

<p>Delicadeza, elegância e estilo.</p>

</div>

</section>

<!-- PESQUISA -->

<section class="pesquisa">

<input

type="text"

id="pesquisa"

placeholder="Pesquisar produtos..."

onkeyup="pesquisarProdutos()">

</section>

<!-- BOTÕES -->

<section class="menu-superior">

<button onclick="mostrarTodos()">

Todos

</button>

<button onclick="mostrarFavoritos()">

❤️ Favoritos

</button>

</section>

<!-- PRODUTOS -->

<section id="produtos">

<h2>Catálogo</h2>

<div class="produtos" id="lista-produtos"></div>

</section>

<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-conteudo">

<h3 id="modal-nome"></h3>

<div id="modal-imagens"></div>

<button onclick="fecharModal()">

Fechar

</button>

</div>

</div>

<!-- IMAGEM TELA CHEIA -->

<div id="modal-imagem-full">

<img id="img-full">

<div id="miniaturas"></div>

<button onclick="fecharImagemFull()">

✕

</button>

</div>

<!-- BOTÃO CARRINHO -->

<div id="carrinho-btn"

onclick="abrirCarrinho()">

🛒

<span id="contador">

0

</span>

</div>

<!-- CARRINHO -->

<div id="carrinho-lateral"

class="carrinho">

<h2>

🛒 Carrinho

</h2>

<div id="itens-carrinho"></div>

<!-- CEP -->

<div class="frete-box">

<input

type="text"

id="cep"

placeholder="Digite seu CEP">

<button onclick="calcularFrete()">

Calcular Frete

</button>

<p id="resultado-frete"></p>

</div>

<p id="total"></p>

<button

onclick="enviarCarrinhoWhatsApp()">

<img

src="imagens/whatsap.png"

width="30">

Finalizar Compra

</button>

<button onclick="fecharCarrinho()">

Fechar

</button>

</div>

<!-- WHATSAPP -->

<div

id="whatsapp-btn"

onclick="enviarCarrinhoWhatsApp()">

📲

</div>
<script src="cep.js"></script>
<script src="script.js"></script>
<script src="script.js"></script>

</body>

</html>
