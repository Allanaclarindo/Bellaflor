<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella Flor | Moda Feminina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== HEADER COM CARRINHO ========== -->
  <header>
    <div class="header-topo">
      <div>
        <h1>🌸 Bella Flor</h1>
        <p>Moda Feminina</p>
      </div>
      <div class="header-carrinho" onclick="abrirCarrinho()">
        🛒 <span id="contador">0</span>
      </div>
    </div>
  </header>

  <!-- ========== BUSCA ========== -->
  <div class="busca-container">
    <input type="text" id="buscar" placeholder="🔍 Buscar produtos..." onkeyup="buscarProdutos()">
  </div>

  <!-- ========== FILTROS ========== -->
  <div class="filtros">
    <button onclick="filtrarCategoria('Todos')" class="filtro-btn ativo">Todos</button>
    <button onclick="filtrarCategoria('Vestidos')" class="filtro-btn">Vestidos</button>
    <button onclick="filtrarCategoria('Conjuntos')" class="filtro-btn">Conjuntos</button>
    <button onclick="filtrarCategoria('Tops')" class="filtro-btn">Tops</button>
    <button onclick="filtrarCategoria('Shorts')" class="filtro-btn">Shorts</button>
    <button onclick="filtrarCategoria('Blusas')" class="filtro-btn">Blusas</button>
    <button onclick="filtrarCategoria('Macaquinhos')" class="filtro-btn">Macaquinhos</button>
    <button onclick="filtrarCategoria('jaquetas')" class="filtro-btn">Jaquetas</button>
  </div>

  <!-- ========== CATÁLOGO ========== -->
  <section id="produtos">
    <h2>🛍️ Catálogo</h2>
    <div class="produtos" id="lista-produtos"></div>
  </section>

  <!-- ========== FRETE (rodapé) ========== -->
  <div class="frete-rodape">
    <div class="frete-content">
      <span>📦 Frete:</span>
      <input type="text" id="cep-frete" placeholder="Digite seu CEP" maxlength="9">
      <button onclick="calcularFretePorCEP()">Calcular</button>
      <span id="frete-info"></span>
    </div>
  </div>

  <!-- ========== WHATSAPP RODAPÉ ========== -->
  <div class="whatsapp-rodape">
    <a href="https://wa.me/5591985144347" target="_blank" class="btn-whatsapp-rodape">
      <img src="imagens/whatsap.png" alt="WhatsApp" width="28">
      Fale conosco no WhatsApp
    </a>
  </div>

  <!-- ========== MODAL ========== -->
  <div id="modal" class="modal">
    <div class="modal-conteudo">
      <h3 id="modal-nome"></h3>
      <div id="modal-imagens"></div>
      <button onclick="fecharModal()" class="btn-fechar-modal">Fechar</button>
    </div>
  </div>

  <!-- ========== CARRINHO LATERAL ========== -->
  <div id="carrinho-lateral" class="carrinho">
    <h2>🛒 Carrinho</h2>
    <div id="itens-carrinho"></div>
    <div id="total"></div>
    <button onclick="enviarCarrinhoWhatsApp()" class="btn-whatsapp-carrinho">
      💬 Finalizar compra
    </button>
    <button onclick="fecharCarrinho()" class="btn-fechar">Fechar</button>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="cep.js"></script>
  <script src="script.js"></script>

</body>
</html>
